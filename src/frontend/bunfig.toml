[install]
# Only install versions published at least 7 days ago (same window as uv exclude-newer on the backend).
minimumReleaseAge = 604800
# Packages allowed to skip the age check, e.g. for an urgent security fix.
minimumReleaseAgeExcludes = []
# Never run dependency lifecycle scripts (preinstall/install/postinstall/prepare).
ignoreScripts = true
