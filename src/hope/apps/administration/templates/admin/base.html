{% extends "admin/base.html" %}

{% block extrahead %}
 {{ form.media }}
  <style>
    #header .theme-toggle { display: none; }

    /* JSONEditor ships light-theme colours only. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        div.jsoneditor-field, div.jsoneditor-value { color: var(--body-fg); }
        div.jsoneditor-readonly, div.jsoneditor td.jsoneditor-separator { color: #a0a0a0; }
        div.jsoneditor-value.jsoneditor-string { color: #7ee787; }
        div.jsoneditor-value.jsoneditor-number { color: #ffa198; }
        div.jsoneditor-value.jsoneditor-boolean { color: #ffa657; }
        div.jsoneditor-value.jsoneditor-null { color: #79c0ff; }
        tr.jsoneditor-highlight, tr.jsoneditor-selected { background-color: #2d333b; }
        div.jsoneditor-field[contenteditable=true]:is(:focus, :hover),
        div.jsoneditor-value[contenteditable=true]:is(:focus, :hover) {
          background-color: #3d3a1a;
          border-color: #6b6420;
        }
        div.jsoneditor-navigation-bar, div.jsoneditor-treepath span { background-color: var(--darkened-bg); color: var(--body-fg); }
        textarea.jsoneditor-text { background-color: var(--body-bg); color: var(--body-fg); }
      }
    }
    :root[data-theme="dark"] {
      div.jsoneditor-field, div.jsoneditor-value { color: var(--body-fg); }
      div.jsoneditor-readonly, div.jsoneditor td.jsoneditor-separator { color: #a0a0a0; }
      div.jsoneditor-value.jsoneditor-string { color: #7ee787; }
      div.jsoneditor-value.jsoneditor-number { color: #ffa198; }
      div.jsoneditor-value.jsoneditor-boolean { color: #ffa657; }
      div.jsoneditor-value.jsoneditor-null { color: #79c0ff; }
      tr.jsoneditor-highlight, tr.jsoneditor-selected { background-color: #2d333b; }
      div.jsoneditor-field[contenteditable=true]:is(:focus, :hover),
      div.jsoneditor-value[contenteditable=true]:is(:focus, :hover) {
        background-color: #3d3a1a;
        border-color: #6b6420;
      }
      div.jsoneditor-navigation-bar, div.jsoneditor-treepath span { background-color: var(--darkened-bg); color: var(--body-fg); }
      textarea.jsoneditor-text { background-color: var(--body-bg); color: var(--body-fg); }
    }
  </style>
  <script>
   document.addEventListener('DOMContentLoaded', () => {
    const header = document.getElementById('header');
    if (!header) return;

    const url = window.location.href;
    const host = window.location.hostname;

    const colorMap = {
        'localhost': '#FF6600',
        'trn': '#BF360C',
        'stg': '#673AB7',
        'dev': '#00796B',
        'eph': '#CC00EF',
        'tst': '#EF00A7'
    };

    let color = '#00ADEF';

    if (host === 'localhost') {
        color = colorMap['localhost'];
    } else {
        for (const env_key of ['dev', 'trn','stg', 'eph','tst']) {
            if (url.includes(env_key)) {
                color = colorMap[env_key];
                break;
            }
        }
    }
    header.style.backgroundColor = color;
    });
  </script>
  {% include 'matomo.html' %}
{% endblock extrahead %}
