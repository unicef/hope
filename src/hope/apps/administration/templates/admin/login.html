{% extends "admin/login.html" %}

{% block footer %}
    <div class="module">
        <blockquote>
            <form method="post" action="{% url 'social:begin' 'azuread-tenant-oauth2' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="button">Login with Azure</button>
            </form>
        </blockquote>
    </div>
{% endblock footer %}
