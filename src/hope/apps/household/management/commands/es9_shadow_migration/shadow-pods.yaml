# Two toolbox pods for the ES9 shadow-cluster delta rehearsal on eph-1.
# Same image + env as hope-core-backend, with the two new management commands
# and a v9-enabled es.py mounted over the image, plus ELASTICSEARCH_HOST_V9.
# Both just sleep; operator execs the commands to control timing vs the copy T0.
---
apiVersion: v1
kind: Pod
metadata:
  name: shadow-delta
  namespace: ictd-hope-eph-1
  labels: {rehearsal: shadow, role: delta}
spec:
  restartPolicy: Never
  serviceAccountName: core
  containers:
    - name: delta
      image: unicef/hope-support-images:core-7b7d83765c6b8a8b264ea6a1d273fdcb4538fd90
      command: ["bash", "-c", "sleep infinity"]
      envFrom:
        - secretRef: {name: hope-core-backend}
        - configMapRef: {name: hope-core-backend}
        - secretRef: {name: keyvault-secret}
      env:
        - {name: ELASTICSEARCH_HOST_V9, value: "http://hope-es-search-master:9200"}
      volumeMounts:
        - {name: tools, mountPath: /app/.venv/lib/python3.14/site-packages/hope/apps/household/management/commands/es_mutate_stream.py, subPath: es_mutate_stream.py}
        - {name: tools, mountPath: /app/.venv/lib/python3.14/site-packages/hope/apps/household/management/commands/es_populate_delta.py, subPath: es_populate_delta.py}
        - {name: tools, mountPath: /app/.venv/lib/python3.14/site-packages/hope/apps/household/management/commands/_es_shadow.py, subPath: _es_shadow.py}
      resources:
        requests: {cpu: 200m, memory: 512Mi}
        limits: {cpu: "2", memory: 2Gi}
  volumes:
    - name: tools
      configMap: {name: shadow-tools}
---
apiVersion: v1
kind: Pod
metadata:
  name: shadow-mutate
  namespace: ictd-hope-eph-1
  labels: {rehearsal: shadow, role: mutate}
spec:
  restartPolicy: Never
  serviceAccountName: core
  containers:
    - name: mutate
      image: unicef/hope-support-images:core-7b7d83765c6b8a8b264ea6a1d273fdcb4538fd90
      command: ["bash", "-c", "sleep infinity"]
      envFrom:
        - secretRef: {name: hope-core-backend}
        - configMapRef: {name: hope-core-backend}
        - secretRef: {name: keyvault-secret}
      env:
        - {name: ELASTICSEARCH_HOST_V9, value: "http://hope-es-search-master:9200"}
      volumeMounts:
        - {name: tools, mountPath: /app/.venv/lib/python3.14/site-packages/hope/apps/household/management/commands/es_mutate_stream.py, subPath: es_mutate_stream.py}
        - {name: tools, mountPath: /app/.venv/lib/python3.14/site-packages/hope/apps/household/management/commands/es_populate_delta.py, subPath: es_populate_delta.py}
        - {name: tools, mountPath: /app/.venv/lib/python3.14/site-packages/hope/apps/household/management/commands/_es_shadow.py, subPath: _es_shadow.py}
      resources:
        requests: {cpu: 200m, memory: 512Mi}
        limits: {cpu: "1", memory: 1Gi}
  volumes:
    - name: tools
      configMap: {name: shadow-tools}
