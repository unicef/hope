# CI-only overrides for compose.yml. The test database is thrown away after the run,
# so durability is not needed; dropping it makes the per-test flush in e2e tests faster.
services:
  db:
    command:
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
